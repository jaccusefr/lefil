<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J’accuse">
<title>J’accuse : Le fil</title>
<style>
:root{--bg:#111;--card:#2b2b2b;--ink:#f2f2f2;--mut:#a5a5a5;--sun:#ffd23f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,system-ui,'Segoe UI',sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#2E2B6B,#4B3F8F 55%,#7A2A5E);position:sticky;top:0;z-index:5;overflow:hidden;padding:calc(22px + env(safe-area-inset-top)) 14px 22px;text-align:center}
header img{position:absolute;left:50%;top:50%;height:200%;transform:translate(-50%,-50%);opacity:.4;clip-path:circle(41% at 51% 49%);pointer-events:none}
header h1{position:relative;margin:0;font:800 1.7rem/1.2 'Arial Narrow',Impact,sans-serif;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.tabs{display:flex;background:#2a2655}
.tabs button{flex:1;padding:12px 4px;border:0;background:none;color:#ddd;font-weight:600;font-size:.95rem;font-family:inherit}
.tabs button[aria-selected=true]{color:#fff;box-shadow:inset 0 -3px #ff4d6d}
.search{padding:12px 14px 0;max-width:640px;margin:0 auto}
.search input{width:100%;font:inherit;padding:11px 16px;border-radius:99px;border:1px solid #444;background:#1c1c1c;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #444;background:#1c1c1c;color:var(--ink);border-radius:99px;padding:7px 13px;font:inherit;font-size:.9rem}
.chips.k .chip{font-size:.8rem;padding:5px 11px;color:var(--mut)}
.chip[aria-pressed=true]{background:#8C7BFF;color:#fff;border-color:#8C7BFF}
.count{color:var(--mut);font-size:.82rem;padding:10px 16px 0;max-width:640px;margin:0 auto}
main{padding:12px 14px 30px;display:grid;gap:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:0;border-radius:22px;overflow:hidden}
.card a{color:inherit;text-decoration:none;display:block}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#333}
.body{padding:12px 14px}
.when{color:var(--mut);font-size:.85rem}
.card h2{font-size:1.2rem;line-height:1.25;margin:4px 0 8px;font-weight:600}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--mut)}
.star{background:none;border:0;color:var(--mut);font-size:1.5rem;padding:4px 8px;margin:-4px -8px}
.star[aria-pressed=true]{color:var(--sun)}
.msg{color:var(--mut);text-align:center;padding:30px 10px}
.stat{color:var(--mut);font-size:.85rem;padding:0 14px 30px;max-width:640px;margin:0 auto}
.stat summary{cursor:pointer}.stat li{margin:3px 0}
.extra{border-top:1px solid #3a3a3a;display:grid;gap:10px}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg button{border:1px solid #555;background:none;color:var(--mut);border-radius:99px;padding:5px 11px;font:inherit;font-size:.8rem}
.tg button[aria-pressed=true]{background:#ff4d6d;border-color:#ff4d6d;color:#fff}
.note{width:100%;min-height:84px;font:inherit;font-size:.95rem;padding:10px 12px;border-radius:12px;border:1px solid #555;background:#1c1c1c;color:var(--ink);resize:vertical}
.acts{display:flex;gap:8px}
.acts button,.tools button{flex:1;border:0;border-radius:99px;padding:10px 12px;font:inherit;font-weight:600;font-size:.9rem;background:#8C7BFF;color:#fff}
.acts button.alt,.tools button.alt{background:#3a3a3a}
.tools{display:flex;gap:8px;padding:12px 14px 0;max-width:640px;margin:0 auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#1f1d3a;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;gap:12px}
.sheet h3{margin:0}
.sheet textarea{min-height:200px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:#fff;color:#111;padding:10px 18px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.on{opacity:1}
.more{display:block;margin:0 auto 10px;border:0;border-radius:99px;padding:12px 22px;font:inherit;font-weight:600;background:#8C7BFF;color:#fff}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style></head><body>
<header><img src="IMG_2453.png" alt=""><h1>J’accuse : Le fil</h1></header>
<div class="tabs" role="tablist">
<button role="tab" id="tu" aria-selected="true">À la une</button>
<button role="tab" id="ta" aria-selected="false">Archive</button>
<button role="tab" id="ts" aria-selected="false">Ma sélection ★</button></div>
<div class="search"><input id="q" type="search" placeholder="Rechercher un mot, un sujet, un média…" aria-label="Rechercher"></div>
<div class="chips" id="chips"></div>
<div class="chips k" id="kinds"></div>
<div class="chips k" id="tagrow" hidden></div>
<div class="chips k" id="months" hidden></div>
<div class="tools" id="tools" hidden><button id="exMd">Exporter (.md)</button><button class="alt" id="exCp">Copier l’export</button></div>
<div class="count" id="count"></div>
<main id="list"></main>
<div class="stat" id="stat"></div>
<div class="ov" id="ov"><div class="sheet"><h3>Fiche post</h3><textarea class="note" id="pt"></textarea><div class="acts"><button id="ptCp">Copier</button><button class="alt" id="ptX">Fermer</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const TAGS=["À vérifier","Post prêt","Article de réponse","Chiffre clé"];
let DATA={items:[],status:[],themes:[],kinds:[]},theme=null,kind=null,tagF=null,q="",tab="u",ARCH=[],MC={},months=[],mSel=null,limit=60,loading=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
let saved=(()=>{let a=null;try{a=JSON.parse(localStorage.getItem("lefil-notes")||"null")}catch(e){}
 if(!a){try{a=JSON.parse(localStorage.getItem("lefil-saved")||"[]").map(i=>({...i,note:"",tags:[]}))}catch(e){a=[]}}
 return a||[]})();
const persist=()=>{try{localStorage.setItem("lefil-notes",JSON.stringify(saved))}catch(e){}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2000)}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast("Copié")}catch(e){const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copié")}catch(x){toast("Copie impossible")}a.remove()}}
const find=l=>saved.find(s=>s.link===l);
const dstr=iso=>new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
function cite(i){return i.title+" — "+i.source+", "+dstr(i.date)+". "+i.link}
function draft(i){return(i.note?i.note+"\n\n":"")+"📰 "+i.title+"\nSource : "+i.source+", "+dstr(i.date)+"\n🔗 "+i.link}
function exportMd(){const L=["# J’accuse : Le fil — export du "+dstr(new Date().toISOString()),""];
 saved.forEach(i=>{L.push("## "+i.title,"- Source : "+i.source+" ("+dstr(i.date)+")","- Lien : "+i.link);
  if((i.tags||[]).length)L.push("- Étiquettes : "+i.tags.join(", "));if(i.note)L.push("- Note : "+i.note.replace(/\n/g,"\n  "));L.push("")});
 return L.join("\n")}
function when(iso){const d=new Date(iso),n=new Date(),h=d.getHours()+"h"+String(d.getMinutes()).padStart(2,"0");
 const day=x=>x.toDateString();const y=new Date(n);y.setDate(n.getDate()-1);
 if(day(d)==day(n))return"Aujourd'hui à "+h;if(day(d)==day(y))return"Hier à "+h;
 return d.toLocaleDateString("fr-FR",d.getFullYear()!==n.getFullYear()?{day:"numeric",month:"short",year:"numeric"}:{day:"numeric",month:"short"})+" à "+h}
async function loadSel(){
 if(!months.length){try{months=(await (await fetch("archive/index.json?"+Date.now())).json()).months}catch(e){months=[]}}
 if(!mSel)mSel=months[0]||null;
 const want=mSel==="*"?months:[mSel];
 loading=true;ARCH=[];render();
 for(const m of want){if(!m)continue;
  if(!MC[m]){try{const t=await (await fetch("archive/"+m+".jsonl?"+Date.now())).text();MC[m]=t.split("\n").filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean)}catch(e){MC[m]=[]}}
  ARCH=ARCH.concat(MC[m])}
 ARCH.sort((a,b)=>b.date.localeCompare(a.date));
 loading=false;render()}
function chips(){
 $("#chips").innerHTML=`<button class="chip" data-t="" aria-pressed="${!theme}">Tous les thèmes</button>`+DATA.themes.map(([k,l])=>`<button class="chip" data-t="${k}" aria-pressed="${theme===k}">${esc(l)}</button>`).join("");
 $("#kinds").innerHTML=`<button class="chip" data-k="" aria-pressed="${!kind}">Toutes les sources</button>`+DATA.kinds.map(k=>`<button class="chip" data-k="${esc(k)}" aria-pressed="${kind===k}">${esc(k)}</button>`).join("")}
function render(){
 $("#tools").hidden=$("#tagrow").hidden=tab!=="s";
 $("#months").hidden=tab!=="a";
 if(tab==="a")$("#months").innerHTML=`<button class="chip" data-m="*" aria-pressed="${mSel==="*"}">Tout</button>`+months.map(m=>`<button class="chip" data-m="${m}" aria-pressed="${mSel===m}">${new Date(m+"-15").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</button>`).join("");
 if(tab==="s")$("#tagrow").innerHTML=`<button class="chip" data-f="" aria-pressed="${!tagF}">Toutes les étiquettes</button>`+TAGS.map(t=>`<button class="chip" data-f="${esc(t)}" aria-pressed="${tagF===t}">${esc(t)}</button>`).join("");
 let items=tab==="s"?saved:tab==="a"?ARCH:DATA.items;
 if(tab==="s"&&tagF)items=items.filter(i=>(i.tags||[]).includes(tagF));
 if(theme)items=items.filter(i=>(i.themes||[]).includes(theme));
 if(kind)items=items.filter(i=>i.kind===kind);
 if(q){const w=norm(q).split(/\s+/).filter(Boolean);items=items.filter(i=>{const t=norm(i.title+" "+i.source+" "+(i.note||""));return w.every(x=>t.includes(x))})}
 $("#count").textContent=items.length+" article"+(items.length>1?"s":"");
 if(!items.length){$("#list").innerHTML=`<p class="msg">${loading?"Chargement de l’archive…":tab==="s"?"Touchez ☆ sur un article pour le retrouver ici.":"Aucun article pour ces filtres."}</p>`;return}
 $("#list").innerHTML=items.slice(0,limit).map(i=>{const on=saved.some(s=>s.link===i.link);
  return`<article class="card"><a href="${esc(i.link)}" target="_blank" rel="noopener">${i.image?`<img src="${esc(i.image)}" alt="" loading="lazy" onerror="this.remove()">`:""}
  <div class="body"><div class="when">${when(i.date)}</div><h2>${esc(i.title)}</h2></div></a>
  <div class="body foot" style="padding-top:0"><span>${esc(i.source)}</span><button class="star" data-l="${esc(i.link)}" aria-pressed="${on}" aria-label="Ajouter à ma sélection">${on?"★":"☆"}</button></div>${tab==="s"?extra(i):""}</article>`}).join("")+(items.length>limit?`<button class="more" data-more="1">Voir plus (${items.length-limit})</button>`:"")}
function extra(i){const l=esc(i.link);return`<div class="body extra"><div class="tg">${TAGS.map(t=>`<button data-g="${l}" data-tag="${esc(t)}" aria-pressed="${(i.tags||[]).includes(t)}">${esc(t)}</button>`).join("")}</div>
 <textarea class="note" data-n="${l}" placeholder="Votre note : angle, citation à vérifier, idée de post…">${esc(i.note||"")}</textarea>
 <div class="acts"><button data-post="${l}">Fiche post</button><button class="alt" data-cite="${l}">Copier la source</button></div></div>`}
document.addEventListener("input",e=>{const n=e.target.dataset&&e.target.dataset.n;if(n){const it=find(n);if(it){it.note=e.target.value;persist()}}});
document.addEventListener("click",e=>{const c=e.target.closest("button");if(!c)return;
 if(c.id==="tu"||c.id==="ts"||c.id==="ta"){tab=c.id==="ts"?"s":c.id==="ta"?"a":"u";["tu","ta","ts"].forEach(id=>$("#"+id).setAttribute("aria-selected",id===c.id));limit=60;if(tab==="a")loadSel();else render();scrollTo(0,0)}
 else if(c.dataset.t!==undefined){theme=c.dataset.t||null;limit=60;chips();render()}
 else if(c.dataset.k!==undefined){kind=c.dataset.k||null;limit=60;chips();render()}
 else if(c.dataset.f!==undefined){tagF=c.dataset.f||null;limit=60;render()}
 else if(c.dataset.g){const it=find(c.dataset.g);if(it){it.tags=it.tags||[];const k=it.tags.indexOf(c.dataset.tag);k>=0?it.tags.splice(k,1):it.tags.push(c.dataset.tag);persist();render()}}
 else if(c.dataset.post){const it=find(c.dataset.post);if(it){$("#pt").value=draft(it);$("#ov").classList.add("on")}}
 else if(c.dataset.cite){const it=find(c.dataset.cite);if(it)copy(cite(it))}
 else if(c.id==="ptCp")copy($("#pt").value)
 else if(c.id==="ptX")$("#ov").classList.remove("on")
 else if(c.id==="exCp")copy(exportMd())
 else if(c.id==="exMd"){const b=new Blob([exportMd()],{type:"text/markdown"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="jaccuse-notes.md";document.body.appendChild(a);a.click();a.remove()}
 else if(c.dataset.m){mSel=c.dataset.m;limit=60;loadSel()}
 else if(c.dataset.more){limit+=60;render()}
 else if(c.dataset.l){const l=c.dataset.l,k=saved.findIndex(s=>s.link===l);
  if(k>=0)saved.splice(k,1);else{const it=DATA.items.concat(ARCH).find(i=>i.link===l);if(it)saved.unshift({...it,note:"",tags:[]})}
  persist();render()}});
$("#q").addEventListener("input",e=>{q=e.target.value.trim();limit=60;render()});
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{DATA=d;chips();render();
 const ok=d.status.filter(s=>s.ok).length;
 $("#stat").innerHTML=`<details><summary>Mis à jour ${when(d.updated).toLowerCase()} · ${ok} sources sur ${d.status.length}</summary><ul>${d.status.map(s=>`<li>${s.ok?"✅":"❌"} ${esc(s.name)} (${s.count})</li>`).join("")}</ul></details>`})
 .catch(()=>{$("#list").innerHTML='<p class="msg">Pas encore de données. Lancez la mise à jour dans l’onglet Actions de GitHub.</p>'});
</script></body></html>
